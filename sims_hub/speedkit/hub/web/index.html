<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novulon's Sims Hub</title>
<link rel="icon" href="img/logo.svg">
<link rel="stylesheet" href="css/hub.css">
<link rel="stylesheet" href="css/care.css">
<!-- the Plus Jakarta Sans web font is added by js/hub.js without blocking; offline, Segoe UI is used -->
<script type="module" src="js/hub.js"></script>

<body>
<div id="app">
  <header id="topbar">
    <a class="brand" href="#home" title="Home">
      <img src="img/logo.svg" alt="" class="logo">
      <div class="brand-text"><b>Novulon's</b><span>Sims Hub</span></div>
    </a>
    <div class="top-mid"><div class="mode-chip hidden" id="mode-chip"></div></div>
    <div class="top-actions">
      <span class="preview-chip hidden" id="preview-chip" title="SpeedKit's engine isn't installed yet, so the Hub shows example data. Nothing on your PC is changed.">Example data</span>
      <span class="game-chip hidden" id="game-chip"><i></i>The Sims 4 is running</span>
      <a class="coffee-btn hidden" id="btn-coffee" target="_blank" rel="noopener" title="Support the Hub"><svg><use href="#i-coffee"/></svg><span>Buy me a coffee</span></a>
      <button class="icon-btn" id="btn-refresh" data-act="refresh" title="Look again"><svg><use href="#i-refresh"/></svg></button>
    </div>
  </header>

  <nav id="rail">
    <a href="#home" data-page="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
    <a href="#saves" data-page="saves"><svg><use href="#i-saves"/></svg><span>Saves</span></a>
    <a href="#library" data-page="library"><svg><use href="#i-library"/></svg><span>Library</span></a>
    <a href="#performance" data-page="performance"><svg><use href="#i-gauge"/></svg><span>Performance</span></a>
    <a href="#tools" data-page="tools"><svg><use href="#i-tools"/></svg><span>Tools</span></a>
  </nav>

  <main id="main"><div class="page" id="page"><div class="page-loading"><div class="spinner"></div><span>Opening the Hub...</span></div></div></main>
</div>

<div id="overlay-root"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<div id="tooltip" class="tooltip hidden" role="tooltip"></div>
