# Builds both apps - "Wicked Animator.exe" and "Sims Hub.exe", each with .NET inside - whenever their desktop code
# changes, and publishes them as the downloads on the "apps" release. Every installed copy swaps itself for a new
# build the next time it opens (shared/desktop/Updater.cs).
name: Build the apps

on:
  push:
    branches: [main]
    paths:
      - 'shared/desktop/**'
      - 'wicked_animator/desktop/**'
      - 'sims_hub/desktop/**'
      - 'wicked_animator/web/img/logo.ico'
      - 'sims_hub/speedkit/hub/web/img/hub.ico'
      - '.github/workflows/build-apps.yml'
      - '.github/release-notes.md'
  workflow_dispatch:

permissions:
  contents: write          # to publish the release

concurrency:
  group: build-apps
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: |
          dotnet publish wicked_animator/desktop/WickedAnimator.csproj -c Release -o publish/animator -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "the animator did not build" }
          dotnet publish sims_hub/desktop/SimsHub.csproj -c Release -o publish/hub -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "the Hub did not build" }
          Copy-Item "publish/animator/Wicked Animator.exe" WickedAnimator.exe
          Copy-Item "publish/hub/Sims Hub.exe" SimsHub.exe

      # a program without its marker could never update itself again, so installed copies would refuse it
      - name: Check they can update themselves
        shell: pwsh
        run: |
          python -c "import sys; bad = [f for f, m in (('WickedAnimator.exe', 'Novulon.WickedAnimator.AutoUpdate.v1'), ('SimsHub.exe', 'Novulon.SimsHub.AutoUpdate.v1')) if m.encode('utf-16-le') not in open(f, 'rb').read()]; sys.exit('no update marker in ' + ', '.join(bad) if bad else 0)"

      # each download with its checksum next to it: installed copies compare it with their own to know a new build
      # is there. (Nothing is committed back to the repository.)
      - name: Publish the downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($f in 'WickedAnimator.exe', 'SimsHub.exe') {
            (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -Path "$f.sha256" -NoNewline -Encoding ascii
          }
          $files = 'WickedAnimator.exe', 'WickedAnimator.exe.sha256', 'SimsHub.exe', 'SimsHub.exe.sha256'
          gh release view apps *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create apps @files --title "Novulon's Sims 4 Apps" --notes-file .github/release-notes.md --latest
          } else {
            # the programs first, their checksums after: a copy that sees the new checksum finds the new program
            gh release upload apps WickedAnimator.exe SimsHub.exe --clobber
            if ($LASTEXITCODE -eq 0) { gh release upload apps WickedAnimator.exe.sha256 SimsHub.exe.sha256 --clobber }
            if ($LASTEXITCODE -eq 0) { gh release edit apps --notes-file .github/release-notes.md --latest }
          }
          if ($LASTEXITCODE -ne 0) { throw "the downloads could not be published" }
