# Rebuilds "Wicked Animator.exe" whenever the desktop app's code changes, and commits it next to web\ and backend\.
# Every installed copy then picks it up by itself the next time it opens (wicked_animator/desktop/Updater.cs).
name: Build Wicked Animator.exe

on:
  push:
    branches: [main]
    paths:
      - 'wicked_animator/desktop/**'
      - 'wicked_animator/web/img/logo.ico'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-animator-exe
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: |
          dotnet publish wicked_animator/desktop/WickedAnimator.csproj -c Release -o publish -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          Copy-Item "publish/Wicked Animator.exe" "wicked_animator/Wicked Animator.exe" -Force

      # an exe without the marker could never update itself again, so installed copies would refuse it
      - name: Check it can update itself
        shell: pwsh
        run: |
          python -c "import sys; d = open('wicked_animator/Wicked Animator.exe', 'rb').read(); sys.exit(0 if 'Novulon.WickedAnimator.AutoUpdate.v1'.encode('utf-16-le') in d else 'the exe has no update marker')"

      - name: Commit the exe
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "wicked_animator/Wicked Animator.exe"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "The exe is unchanged."; exit 0 }
          git commit -m "Rebuild Wicked Animator.exe"
          git pull --rebase origin $env:GITHUB_REF_NAME
          git push origin HEAD:$env:GITHUB_REF_NAME
